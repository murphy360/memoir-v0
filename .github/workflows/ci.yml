# From murphy360/standards templates/ci.yml: two images (api, web), each linted and tested in its own directory.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standards:
    uses: murphy360/standards/.github/workflows/standards-check.yml@v2
  lint-api:
    uses: murphy360/standards/.github/workflows/python-lint.yml@v2
    with:
      working-directory: backend
      format-check: true
      # v2 lints every file by default; this backend still carries v1-era findings, so
      # only the files a change touches must be clean until that debt is paid down.
      mode: changed
  lint-web:
    # Pinned to the merge of murphy360/standards#2 until node-lint is tagged (v2.2.0); then @v2 like the others.
    uses: murphy360/standards/.github/workflows/node-lint.yml@1b8a062ac454e98fbd68b7a0c186442395a56f77
    with:
      working-directory: frontend
      format-check: true
      # The v0 frontend carries old lint debt (40 findings); every file a change touches must be clean.
      mode: changed
      standards-ref: 1b8a062ac454e98fbd68b7a0c186442395a56f77
  workflows:
    uses: murphy360/standards/.github/workflows/actionlint.yml@v2
  test-api:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v2
    with:
      context: backend
      file: backend/Dockerfile
      target: test
      command: "cd backend && pytest -q"
  test-web:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v2
    with:
      context: frontend
      file: frontend/Dockerfile
      target: test
      command: "cd frontend && npm run typecheck && npm test"
  image-api:
    # image.yml from v2: v1's names every image's digests the same, so a run that
    # builds two images mixes them up (murphy360/standards#11).
    needs: [lint-api, test-api]
    uses: murphy360/standards/.github/workflows/image.yml@v2
    with:
      image: memoir-v0-api
      context: backend
      file: backend/Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
  image-web:
    needs: [lint-web, test-web]
    uses: murphy360/standards/.github/workflows/image.yml@v2
    with:
      image: memoir-v0-web
      context: frontend
      file: frontend/Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
